# /etc/tmpfiles.d/hunter-rsm.conf
# Stable, administrator-owned socket directory. NOT under /run (recreated on every boot and
# by RuntimeDirectory=), NOT under /etc. Never world-accessible; only root and the rootless
# user's primary group can traverse it, and only systemd (as root) creates the socket in it.
d /var/lib/hunter-rsm-ipc 0750 root __HUNTER_CLIENT_GROUP__ -
