name: internship-hunter

# Trust boundaries (see docs/security-architecture.md)
#   data   (internal)  postgres, migrate, api, discovery, scheduler, telegram
#   queue  (internal)  redis, api, discovery, scheduler, telegram
#   edge               api (published on 127.0.0.1 only)
#   egress             discovery (ATS boards), telegram (Telegram API)
#   agent_<name>       exactly one untrusted agent container + the discovery orchestrator
# Agent containers have NO Redis, NO PostgreSQL, NO admin/Telegram secrets and cannot reach
# each other: the orchestrator calls their HTTP planner and validates every reply.
x-redis-url: &redis-url redis://:${REDIS_PASSWORD:?set_REDIS_PASSWORD}@redis:6379/0
x-db-env: &db-env
  DATABASE_URL: postgresql+psycopg://hunter:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD}@postgres:5432/hunter
  REDIS_URL: *redis-url
  PROFILES_PATH: /app/config/search_profiles.yaml
  SOURCES_PATH: /app/config/sources.yaml
  AGENT_MODE: ${AGENT_MODE:-demo}
x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
x-app: &app
  <<: *hardening
  image: internship-hunter-app:${RELEASE_SHA:-dev}
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  mem_limit: 256m
  cpus: 0.5
x-agent: &agent
  <<: *hardening
  image: internship-hunter-agent:${RELEASE_SHA:-dev}
  build:
    context: .
    dockerfile: docker/agent.Dockerfile
  command: ["uvicorn", "--factory", "hunter.agent_runner:app_from_env",
            "--host", "0.0.0.0", "--port", "8100"]
  mem_limit: 768m
  cpus: 1.0
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 5

services:
  postgres:
    <<: *hardening
    image: postgres:17-alpine
    read_only: false              # data dir + /var/run/postgresql
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]   # official entrypoint needs these
    environment:
      POSTGRES_USER: hunter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD}
      POSTGRES_DB: hunter
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [data]
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hunter -d hunter"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    <<: *hardening
    image: redis:7-alpine
    user: "999:1000"             # redis:redis; the entrypoint is bypassed, so set it explicitly
    command: ["sh", "-c", "printf 'requirepass %s\\n' \"$$REDIS_PASSWORD\" > /tmp/redis.conf && exec redis-server /tmp/redis.conf --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set_REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set_REDIS_PASSWORD}
    volumes: [redis_data:/data]
    networks: [queue]
    mem_limit: 192m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
  migrate:
    <<: *app
    restart: "no"
    command: ["python", "-m", "hunter.db"]
    environment: *db-env
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    command: ["uvicorn", "hunter.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *db-env
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set_ADMIN_TOKEN}
    networks: [data, queue, edge]
    ports: ["127.0.0.1:8000:8000"]   # loopback only; reach it over Tailscale / SSH forward
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      retries: 5
  discovery:
    <<: *app
    command: ["python", "-m", "hunter.worker"]
    environment:
      <<: *db-env
      HUNTER_QUEUE: discovery
      AGENT_TOKEN_CLAUDE_1: ${AGENT_TOKEN_CLAUDE_1:?set_AGENT_TOKEN_CLAUDE_1}
      AGENT_TOKEN_CLAUDE_2: ${AGENT_TOKEN_CLAUDE_2:?set_AGENT_TOKEN_CLAUDE_2}
      AGENT_TOKEN_CODEX: ${AGENT_TOKEN_CODEX:?set_AGENT_TOKEN_CODEX}
    networks: [data, queue, egress, agent_claude_1, agent_claude_2, agent_codex]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  scheduler:
    <<: *app
    command: ["python", "-m", "hunter.scheduler"]
    environment:
      <<: *db-env
      SCAN_CRON: ${SCAN_CRON:-0 7,13,20 * * *}
      TZ: ${TZ:-Europe/Zurich}
    networks: [data, queue]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  telegram:
    <<: *app
    command: ["python", "-m", "hunter.telegram"]
    environment:
      <<: *db-env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:-}
    networks: [data, queue, egress]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  agent-claude-1:
    <<: *agent
    environment:
      HUNTER_AGENT_NAME: claude-1
      AGENT_TOKEN: ${AGENT_TOKEN_CLAUDE_1:?set_AGENT_TOKEN_CLAUDE_1}
      CLAUDE_CONFIG_DIR: /home/hunter/.claude
      AGENT_MODE: ${AGENT_MODE:-demo}
    volumes: [claude1_home:/home/hunter]
    networks: [agent_claude_1]
  agent-claude-2:
    <<: *agent
    environment:
      HUNTER_AGENT_NAME: claude-2
      AGENT_TOKEN: ${AGENT_TOKEN_CLAUDE_2:?set_AGENT_TOKEN_CLAUDE_2}
      CLAUDE_CONFIG_DIR: /home/hunter/.claude
      AGENT_MODE: ${AGENT_MODE:-demo}
    volumes: [claude2_home:/home/hunter]
    networks: [agent_claude_2]
  agent-codex:
    <<: *agent
    environment:
      HUNTER_AGENT_NAME: codex
      AGENT_TOKEN: ${AGENT_TOKEN_CODEX:?set_AGENT_TOKEN_CODEX}
      CODEX_HOME: /home/hunter/.codex
      AGENT_MODE: ${AGENT_MODE:-demo}
    volumes: [codex_home:/home/hunter]
    networks: [agent_codex]

networks:
  data: {internal: true}
  queue: {internal: true}
  edge: {}
  egress: {}
  agent_claude_1: {}      # not internal: the CLI needs its provider's API
  agent_claude_2: {}
  agent_codex: {}
volumes:
  postgres_data:
  redis_data:
  claude1_home:
  claude2_home:
  codex_home:
