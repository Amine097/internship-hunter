name: internship-hunter

# Trust boundaries (see docs/security-architecture.md)
#   data           (internal)  postgres, migrate, api, discovery, scheduler, telegram
#   edge                       api (published on 127.0.0.1 only)
#   egress                     discovery (ATS boards), telegram (Telegram API)
#   egress_<name>              exactly ONE egress proxy each: proxies cannot see each other
#   agent_<name>   (internal)  exactly one untrusted agent, its egress proxy, the orchestrator
# Every non-internal network (edge, egress, egress_<name>) has a route out. On rootless Docker
# that route ends in the daemon's user-space NAT, which can dial any address the HOST can,
# including its Tailscale IP. Hostname filtering in the proxy is not a network boundary; the
# host-level guard is (deploy/host-egress-guard.sh, docs/deployment.md "Host isolation"), and
# EGRESS_FORBIDDEN_TARGETS makes the proxies report when it is missing.
# The work queue lives in PostgreSQL (no Redis). Agent containers have NO database access,
# NO admin/Telegram secrets, cannot reach each other, and have NO route to anything except
# their own allow-listing egress proxy: the agent networks are internal, so ignoring
# HTTPS_PROXY gets a connection error, not a bypass.
x-db-env: &db-env
  DATABASE_URL: postgresql+psycopg://hunter:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD}@postgres:5432/hunter
  PROFILES_PATH: /app/config/search_profiles.yaml
  SOURCES_PATH: /app/config/sources.yaml
  AGENT_MODE: ${AGENT_MODE:-demo}
  # set only by the deploy script, after it verified rollback compatibility
  HUNTER_ACCEPT_SCHEMA_REVISION: ${HUNTER_ACCEPT_SCHEMA_REVISION:-}
x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
x-app: &app
  <<: *hardening
  image: internship-hunter-app:${RELEASE_SHA:-dev}
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  mem_limit: 256m
  cpus: 0.5
x-agent: &agent
  <<: *hardening
  restart: "no"    # supervised: started by deploy/runtime-containment.sh, never by the daemon (see "services")
  image: internship-hunter-agent:${RELEASE_SHA:-dev}
  build:
    context: .
    dockerfile: docker/agent.Dockerfile
  command: ["uvicorn", "--factory", "hunter.agent_runner:app_from_env",
            "--host", "0.0.0.0", "--port", "8100"]
  mem_limit: 768m
  cpus: 1.0
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 5

# RESTART POLICY. Every service with a route out (api, discovery, telegram, the three proxies) and
# every agent is `restart: "no"`: after a reboot or a daemon restart the Docker daemon starts NONE of
# them. deploy/runtime-containment.sh (a systemd user unit) starts them, and only once the host
# guard is verified, the protected host addresses are live (Tailscale can be late) and the rendered
# DNS matches the guard; it also restarts a crashed one, stops them all if an invariant is lost, and
# remote-deploy.sh refuses to commit a release in which one of them has another policy.
# postgres, scheduler and session-controller have no route to the host and keep `unless-stopped`.
services:
  postgres:
    <<: *hardening
    image: postgres:17-alpine
    read_only: false              # data dir + /var/run/postgresql
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]   # official entrypoint needs these
    environment:
      POSTGRES_USER: hunter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD}
      POSTGRES_DB: hunter
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [data]
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hunter -d hunter"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    <<: *app
    restart: "no"
    command: ["python", "-m", "hunter.db"]
    environment: *db-env
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    restart: "no"
    entrypoint: ["/usr/local/bin/isolation-gate.sh"]    # refuses to start unguarded (R7)
    command: ["uvicorn", "hunter.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *db-env
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set_ADMIN_TOKEN}
      EGRESS_FORBIDDEN_TARGETS: ${EGRESS_FORBIDDEN_TARGETS:-}
    dns: ["${HUNTER_DNS:-10.0.2.3}"]   # explicit resolver: queries leave the container and cross the guard (docs/deployment.md, "DNS")
    networks: [data, edge]
    # Loopback only; reach it over Tailscale / SSH forward. Host port 18000, container port 8000:
    # the production host already runs a rootful service on <tailscale ip>:8000 (Gluetun), so the
    # default must not collide with, or be mistaken for, port 8000 on that machine.
    ports: ["127.0.0.1:18000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      retries: 5
  discovery:
    <<: *app
    restart: "no"
    entrypoint: ["/usr/local/bin/isolation-gate.sh"]    # refuses to start unguarded (R7)
    command: ["python", "-m", "hunter.worker"]
    stop_grace_period: 150s   # finish/release the current scan before SIGKILL (agents <= 110s)
    environment:
      <<: *db-env
      EGRESS_FORBIDDEN_TARGETS: ${EGRESS_FORBIDDEN_TARGETS:-}
      AGENT_TOKEN_CLAUDE_1: ${AGENT_TOKEN_CLAUDE_1:?set_AGENT_TOKEN_CLAUDE_1}
      AGENT_TOKEN_CLAUDE_2: ${AGENT_TOKEN_CLAUDE_2:?set_AGENT_TOKEN_CLAUDE_2}
      AGENT_TOKEN_CODEX: ${AGENT_TOKEN_CODEX:?set_AGENT_TOKEN_CODEX}
    dns: ["${HUNTER_DNS:-10.0.2.3}"]   # explicit resolver: queries leave the container and cross the guard (docs/deployment.md, "DNS")
    networks: [data, egress, agent_claude_1, agent_claude_2, agent_codex]
    depends_on:
      migrate: {condition: service_completed_successfully}
  scheduler:
    <<: *app
    command: ["python", "-m", "hunter.scheduler"]
    environment:
      <<: *db-env
      SCAN_CRON: ${SCAN_CRON:-0 7,13,20 * * *}
      TZ: ${TZ:-Europe/Zurich}
    networks: [data]
    depends_on:
      migrate: {condition: service_completed_successfully}
  # Drives approved research sessions: talks to PostgreSQL only (and, when the optional
  # compose.rsm.yaml override is used, to the host broker socket). It is the ONLY service that
  # may ever hold that socket. No Docker socket, no agent networks.
  session-controller:
    <<: *app
    command: ["python", "-m", "hunter.session_controller"]
    environment:
      <<: *db-env
      RSM_ENABLED: "false"
    networks: [data]
    depends_on:
      migrate: {condition: service_completed_successfully}
  telegram:
    <<: *app
    restart: "no"
    entrypoint: ["/usr/local/bin/isolation-gate.sh"]    # refuses to start unguarded (R7)
    command: ["python", "-m", "hunter.telegram"]
    environment:
      <<: *db-env
      EGRESS_FORBIDDEN_TARGETS: ${EGRESS_FORBIDDEN_TARGETS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:-}
    dns: ["${HUNTER_DNS:-10.0.2.3}"]   # explicit resolver: queries leave the container and cross the guard (docs/deployment.md, "DNS")
    networks: [data, egress]
    depends_on:
      migrate: {condition: service_completed_successfully}
  agent-claude-1:
    <<: *agent
    environment:
      HUNTER_AGENT_NAME: claude-1
      HTTPS_PROXY: http://egress-claude-1:3128
      HTTP_PROXY: http://egress-claude-1:3128
      NO_PROXY: localhost,127.0.0.1
      AGENT_TOKEN: ${AGENT_TOKEN_CLAUDE_1:?set_AGENT_TOKEN_CLAUDE_1}
      CLAUDE_CONFIG_DIR: /home/hunter/.claude
      AGENT_MODE: ${AGENT_MODE:-demo}
    volumes: [claude1_home:/home/hunter]
    depends_on:
      egress-claude-1: {condition: service_healthy}
    networks: [agent_claude_1]
  agent-claude-2:
    <<: *agent
    environment:
      HUNTER_AGENT_NAME: claude-2
      HTTPS_PROXY: http://egress-claude-2:3128
      HTTP_PROXY: http://egress-claude-2:3128
      NO_PROXY: localhost,127.0.0.1
      AGENT_TOKEN: ${AGENT_TOKEN_CLAUDE_2:?set_AGENT_TOKEN_CLAUDE_2}
      CLAUDE_CONFIG_DIR: /home/hunter/.claude
      AGENT_MODE: ${AGENT_MODE:-demo}
    volumes: [claude2_home:/home/hunter]
    depends_on:
      egress-claude-2: {condition: service_healthy}
    networks: [agent_claude_2]
  agent-codex:
    <<: *agent
    environment:
      HUNTER_AGENT_NAME: codex
      HTTPS_PROXY: http://egress-codex:3128
      HTTP_PROXY: http://egress-codex:3128
      NO_PROXY: localhost,127.0.0.1
      AGENT_TOKEN: ${AGENT_TOKEN_CODEX:?set_AGENT_TOKEN_CODEX}
      CODEX_HOME: /home/hunter/.codex
      AGENT_MODE: ${AGENT_MODE:-demo}
    volumes: [codex_home:/home/hunter]
    depends_on:
      egress-codex: {condition: service_healthy}
    networks: [agent_codex]

  # Allow-listing egress proxies, one per agent (the hostname lists are the policy; the proxy also
  # requires TLS SNI == the CONNECT host, see docker/egress_proxy.py). The defaults are exactly the
  # hosts the PINNED CLIs contact, as invoked by hunter/agents.py, measured by tests/cli_probe
  # (CI job cli-egress-probe): Claude Code - the API and its OAuth token endpoint; Codex - the API
  # (API-key login) or the ChatGPT backend and its OAuth token endpoint (ChatGPT login).
  egress-claude-1: &egress
    <<: *hardening
    restart: "no"
    image: internship-hunter-egress:${RELEASE_SHA:-dev}
    build:
      context: .
      dockerfile: docker/egress-proxy.Dockerfile
    environment:
      EGRESS_ALLOW: ${EGRESS_ALLOW_ANTHROPIC:-api.anthropic.com,platform.claude.com}
      EGRESS_FORBIDDEN_TARGETS: ${EGRESS_FORBIDDEN_TARGETS:-}
    dns: ["${HUNTER_DNS:-10.0.2.3}"]   # explicit resolver: queries leave the container and cross the guard (docs/deployment.md, "DNS")
    networks: [egress_claude_1, agent_claude_1]
    mem_limit: 64m
    cpus: 0.25
    # Listening AND (when EGRESS_FORBIDDEN_TARGETS is set) unable to reach any host address
    # listed there: a proxy that can reach the host is "unhealthy", so agents do not start
    # and `up --wait` (the deploy) fails closed. Detection, not prevention: see the guard.
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/egress-healthcheck.sh"]
      interval: 10s
      timeout: 15s
      retries: 5
  egress-claude-2:
    <<: *egress
    networks: [egress_claude_2, agent_claude_2]
  egress-codex:
    <<: *egress
    environment:
      EGRESS_ALLOW: ${EGRESS_ALLOW_OPENAI:-api.openai.com,auth.openai.com,chatgpt.com}
      EGRESS_FORBIDDEN_TARGETS: ${EGRESS_FORBIDDEN_TARGETS:-}
    networks: [egress_codex, agent_codex]

networks:
  data: {internal: true}
  edge: {}
  egress: {}                          # discovery, telegram
  egress_claude_1: {}                 # one network per proxy: they cannot reach each other
  egress_claude_2: {}
  egress_codex: {}
  agent_claude_1: {internal: true}   # no route out: only the egress proxy is reachable
  agent_claude_2: {internal: true}
  agent_codex: {internal: true}
volumes:
  postgres_data:
  claude1_home:
  claude2_home:
  codex_home:
