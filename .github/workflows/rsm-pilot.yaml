# MANUAL, EXPERIMENTAL: runs the Resource Session Manager pilot (deploy/rsm/pilot) on a real
# Ubuntu 24.04 runner: system systemd (SocketUser/SocketGroup/EACCES), a rootful Docker for
# DISPOSABLE hv-pilot-* containers, and a real ROOTLESS Docker daemon for a dedicated user.
# It never runs on push/PR, holds no secrets, and cannot reach anything but the runner VM.
#
# Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor. This job does NOT disable
# that restriction: it installs a profile for the single binary /usr/bin/rootlesskit, as
# Docker's rootless documentation describes.
name: RSM pilot (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Dedicated rootless user (never in the rootful docker group)
        run: |
          sudo adduser --disabled-password --gecos "" hunter-deploy
          sudo loginctl enable-linger hunter-deploy
          grep '^hunter-deploy:' /etc/subuid /etc/subgid
          ! id -nG hunter-deploy | tr ' ' '\n' | grep -qx docker
      - name: Rootless prerequisites and a binary-specific AppArmor profile
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq uidmap dbus-user-session slirp4netns
          command -v rootlesskit dockerd-rootless-setuptool.sh \
            || sudo apt-get install -y -qq docker-ce-rootless-extras
          sudo tee /etc/apparmor.d/usr.bin.rootlesskit >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          /usr/bin/rootlesskit flags=(unconfined) {
            userns,
            include if exists <local/usr.bin.rootlesskit>
          }
          PROFILE
          sudo systemctl restart apparmor.service
          sysctl kernel.apparmor_restrict_unprivileged_userns   # left at its default
      - name: Start the rootless Docker daemon for hunter-deploy
        run: |
          uid=$(id -u hunter-deploy)
          sudo systemctl start "user@${uid}.service"
          sudo -u hunter-deploy env XDG_RUNTIME_DIR="/run/user/${uid}" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/${uid}/bus" \
            dockerd-rootless-setuptool.sh install
          sudo -u hunter-deploy env XDG_RUNTIME_DIR="/run/user/${uid}" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/${uid}/bus" \
            systemctl --user start docker.service
          for _ in $(seq 1 30); do [ -S "/run/user/${uid}/docker.sock" ] && break; sleep 1; done
          sudo -u hunter-deploy env XDG_RUNTIME_DIR="/run/user/${uid}" \
            DOCKER_HOST="unix:///run/user/${uid}/docker.sock" docker info --format '{{.SecurityOptions}}'
      - name: Install the pilot
        run: sudo deploy/rsm/pilot/install-pilot.sh --client-user hunter-deploy
      - name: Run the pilot acceptance tests
        run: sudo deploy/rsm/pilot/pilot-test.sh --client-user hunter-deploy --require-rootless
      - name: Diagnostics on failure
        if: failure()
        run: |
          sudo systemctl status hunter-rsm.socket hunter-rsm.service --no-pager || true
          sudo journalctl -u hunter-rsm.service -u hunter-rsm.socket --no-pager | tail -80 || true
          sudo tail -40 /var/lib/hunter-rsm/audit.log || true
