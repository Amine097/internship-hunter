name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # never cancel runs on main: every main SHA must be able to earn a green run to be deployable
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI_REQUIRE_SERVICES: "1"   # tests that need PostgreSQL/Redis fail instead of skipping
jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: hunter_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/hunter_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"        # same minor as docker/*.Dockerfile
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python --version | grep -q '^Python 3\.12\.'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q -rs

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          docker run --rm -v "$PWD/deploy:/mnt:ro" koalaman/shellcheck:v0.10.0 -x \
            /mnt/remote-deploy.sh /mnt/smoke-test.sh /mnt/verify-restore.sh /mnt/make-bundle.sh

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install . pip-audit
      - run: pip-audit --skip-editable

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0}
      - run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --redact --verbose

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate throwaway secrets
        run: |
          {
            for k in POSTGRES_PASSWORD REDIS_PASSWORD ADMIN_TOKEN AGENT_TOKEN_CLAUDE_1 \
                     AGENT_TOKEN_CLAUDE_2 AGENT_TOKEN_CODEX; do
              echo "$k=$(openssl rand -hex 24)"
            done
            echo "AGENT_MODE=demo"
          } > .env
          echo "ADMIN_TOKEN=$(grep '^ADMIN_TOKEN=' .env | cut -d= -f2-)" >> "$GITHUB_ENV"
      - name: Validate compose file
        run: docker compose config -q
      - name: Lint Dockerfiles
        run: |
          for f in app agent; do
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint \
              --ignore DL3008 --ignore DL3013 --ignore DL3016 - < docker/$f.Dockerfile
          done
      - name: Build, start and wait for healthchecks (real daemon)
        run: docker compose up -d --build --wait --wait-timeout 420
      - name: Smoke + isolation + attack-injection test
        run: deploy/smoke-test.sh
      - name: Backup restores into a scratch database
        run: deploy/verify-restore.sh
      - name: Containers run as expected users
        run: |
          docker compose exec -T redis id -u | grep -vx 0
          docker compose exec -T agent-codex id -u | grep -vx 0
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down -v
