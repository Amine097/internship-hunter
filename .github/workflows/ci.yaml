name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # never cancel runs on main: every main SHA must be able to earn a green run to be deployable
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI_REQUIRE_SERVICES: "1"   # tests that need PostgreSQL fail instead of skipping
jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: hunter_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/hunter_test
      # real Docker + DISPOSABLE containers named hv-rsm-test-* (never anything else)
      RSM_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"        # same minor as docker/*.Dockerfile
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python --version | grep -q '^Python 3\.12\.'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q -rs
      - name: Deploy scripts keep their executable bit in git
        run: |
          bad=$(git ls-files -s 'deploy/*.sh' 'deploy/*.py' | awk '$1 != "100755" {print $4}')
          [ -z "$bad" ] || { echo "not executable in git: $bad"; exit 1; }

  # The PRODUCTION RSM units under the real SYSTEM manager (tests/test_rsm_systemd.py). Needs
  # root, so it runs only here: an ephemeral GitHub-hosted VM, disposable users, a fake docker,
  # no credentials of any kind. Fork PRs never reach it (privileged execution is for this
  # repository's own branches).
  # AppArmor and user-namespace restrictions are left exactly as the runner ships them.
  rsm-systemd:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false   # code runs as root below: no token left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - name: Production units under the system manager (root, disposable)
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT \
            env RSM_SYSTEMD=1 PYTHONDONTWRITEBYTECODE=1 \
            "$(command -v python)" -m pytest -q -rs -p no:cacheprovider tests/test_rsm_systemd.py \
            | tee rsm-systemd.log
          # every test must have RUN: a skip here would hide a sandbox that cannot be established
          if grep -qE '[0-9]+ (skipped|deselected)' rsm-systemd.log; then exit 1; fi
      - name: Remove the disposable installation and prove nothing is left (also on failure)
        if: always()
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT env PYTHONDONTWRITEBYTECODE=1 \
            "$(command -v python)" tests/test_rsm_systemd.py --cleanup

  # The REAL host-egress-guard against REAL iptables and packets, in disposable user+network
  # namespaces (tests/netns_guard_sandbox.sh): reproduces "a container reaches the host's tailnet
  # IP" and proves the guard closes it, status detects tampering and remove restores Docker's rules.
  # This is a MANDATORY security job. Every step runs under `shell: bash` (= bash -eo pipefail) and
  # starts with `set -euo pipefail`: with GitHub's default `bash -e` a failing `pytest | tee` is
  # swallowed by the pipe and the job stays green. If namespaces cannot be created the job FAILS
  # loudly (it never reports success for tests that did not run) - see docs/deployment.md "CI".
  # No sudo and no AppArmor/sysctl change (this repository never relaxes either; see the
  # rsm-systemd job): it runs on ubuntu-22.04, whose kernel does not restrict unprivileged user
  # namespaces. ubuntu-24.04 does restrict them: moving this job there needs a per-binary
  # AppArmor profile for /usr/bin/unshare (as rsm-pilot.yaml does for rootlesskit), i.e. elevated privileges,
  # which is a policy decision, not something to do silently.
  host-guard-netns:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      # the workflow-level value makes tests/conftest.py demand a PostgreSQL URL for ANY pytest
      # run; this job runs no database test (the lint-test job does)
      CI_REQUIRE_SERVICES: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - name: Namespaces and iptables must be available (otherwise this REQUIRED job fails)
        shell: bash
        run: |
          set -euo pipefail
          if ! { unshare -Urn true && command -v iptables && command -v ip6tables && command -v nsenter; } >/dev/null 2>&1; then
            echo "::error title=Mandatory security job cannot run::Unprivileged user+network namespaces or iptables are unavailable on this runner, so NO packet-level evidence exists for host-egress-guard.sh. This is a CI blocker, not a skip: use a runner that allows them (docs/deployment.md, CI)."
            {
              echo "## BLOCKED: packet-level host-egress-guard tests cannot run on this runner"
              echo
              echo "tests/test_host_egress_guard_netns.py and tests/test_host_egress_guard_detached_netns.py are required security checks and were NOT executed."
              echo "Compatible runner: ubuntu-22.04 (unrestricted user namespaces) - or ubuntu-24.04 with a"
              echo "per-binary AppArmor profile for /usr/bin/unshare (needs elevated privileges: a policy decision)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Packet-level guard tests (a failure OR a skip fails the job)
        shell: bash
        env:
          GUARD_NETNS_REQUIRED: "1"
        run: |
          set -euo pipefail
          python -m pytest -q -rs -p no:cacheprovider tests/test_host_egress_guard_netns.py tests/test_host_egress_guard_detached_netns.py | tee netns.log
          if grep -qE '[0-9]+ (skipped|deselected)' netns.log; then
            echo "::error title=Security tests skipped::the host-egress-guard namespace tests skipped tests"
            exit 1
          fi

  # REAL rootless Docker (rootlesskit --detach-netns + slirp4netns, the production layout) run as
  # an unprivileged user (tests/rootless_lab/lab.sh: pinned, checksummed tools; no sudo; no
  # AppArmor or sysctl change - ubuntu-22.04, like host-guard-netns). The project's real
  # compose.yaml networks, the real host guard and the real deploy/check-dns.sh against real DNS
  # packets. A failure OR a skip fails the job: there is no success-on-skip path.
  rootless-dns-lab:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      CI_REQUIRE_SERVICES: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - name: Namespaces, iptables and the download tools must be available (otherwise this REQUIRED job fails)
        shell: bash
        run: |
          set -euo pipefail
          if ! { unshare -Ur true && command -v iptables && command -v ip6tables && command -v nsenter \
                 && command -v curl && command -v tar && command -v sha256sum; } >/dev/null 2>&1; then
            echo "::error title=Mandatory security job cannot run::Unprivileged user namespaces, iptables or curl/tar are unavailable on this runner, so NO evidence exists that DNS takes the guard-policed path on a real rootless Docker. This is a CI blocker, not a skip."
            exit 1
          fi
      - name: Real rootless Docker, real compose networks, real DNS (a failure OR a skip fails the job)
        shell: bash
        env:
          HUNTER_ROOTLESS_LAB: "1"
          HUNTER_ROOTLESS_LAB_REQUIRED: "1"
          HUNTER_LAB_LOG_DIR: ${{ runner.temp }}/lab-logs
        run: |
          set -euo pipefail
          python -m pytest -q -rs -p no:cacheprovider tests/test_dns_rootless_lab.py | tee lab.log
          if grep -qE '[0-9]+ (skipped|deselected)' lab.log; then
            echo "::error title=Security tests skipped::the rootless DNS lab skipped tests"
            exit 1
          fi
      - name: Daemon log on failure
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/lab-logs/*; do echo "=== $f"; tail -n 60 "$f"; done || true

  # The repository's REAL compose topology on a throwaway rootless Docker (tests/rootless_lab/lab.sh),
  # a listener on every probed port: every ordered container pair connects EXACTLY when they share a
  # network - agents reach only their own proxy and discovery, proxies only their agent and discovery,
  # postgres only the data network (tests/test_egress_topology_lab.py, from the PR #14 review). No sudo,
  # no AppArmor change. A failure OR a skip fails the job.
  egress-topology-lab:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      CI_REQUIRE_SERVICES: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - name: Namespaces, iptables and the download tools must be available (otherwise this REQUIRED job fails)
        shell: bash
        run: |
          set -euo pipefail
          if ! { unshare -Ur true && command -v iptables && command -v nsenter && command -v curl \
                 && command -v tar && command -v sha256sum; } >/dev/null 2>&1; then
            echo "::error title=Mandatory security job cannot run::Unprivileged user namespaces, iptables or curl/tar are unavailable on this runner, so NO evidence exists that the agent/proxy topology isolates on a real rootless Docker. This is a CI blocker, not a skip."
            exit 1
          fi
      - name: Real rootless Docker, real compose topology, every container pair (a failure OR a skip fails the job)
        shell: bash
        env:
          HUNTER_ROOTLESS_LAB: "1"
          HUNTER_ROOTLESS_LAB_REQUIRED: "1"
        run: |
          set -euo pipefail
          python -m pytest -q -rs -p no:cacheprovider tests/test_egress_topology_lab.py | tee topo.log
          if grep -qE '[0-9]+ (skipped|deselected)' topo.log; then
            echo "::error title=Security tests skipped::the topology lab skipped tests"
            exit 1
          fi

  # The PINNED Claude Code and Codex CLIs (versions read from docker/agent.Dockerfile), run exactly as
  # hunter/agents.py runs them, in a user+network namespace holding nothing but loopback
  # (tests/cli_probe): they must do no DNS of their own, send only CONNECT <host>:443 with SNI == host
  # and no Encrypted Client Hello, need only allow-listed hosts and no longer try the hosts the
  # hardening turns off. Dummy credentials; nothing can leave the runner. No sudo, no AppArmor change.
  # A failure OR a skip fails the job.
  cli-egress-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CI_REQUIRE_SERVICES: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - name: Namespaces and tools must be available (otherwise this REQUIRED job fails)
        shell: bash
        run: |
          set -euo pipefail
          if ! { unshare -Urnm true && command -v ip && command -v curl && command -v sha256sum \
                 && command -v shellcheck; } >/dev/null 2>&1; then
            echo "::error title=Mandatory security job cannot run::Unprivileged user+network+mount namespaces or tools are unavailable on this runner, so NO evidence exists of what the pinned CLIs send through the egress proxy. This is a CI blocker, not a skip."
            exit 1
          fi
      - name: Checksummed Node and the pinned CLIs
        shell: bash
        run: |
          set -euo pipefail
          shellcheck tests/cli_probe/install.sh tests/cli_probe/run_probe.sh
          bin="$(bash tests/cli_probe/install.sh "$RUNNER_TEMP/cli")"
          echo "HUNTER_CLI_BIN=$bin" >> "$GITHUB_ENV"
      - name: What the pinned CLIs send (a failure OR a skip fails the job)
        shell: bash
        env:
          HUNTER_CLI_PROBE: "1"
          HUNTER_CLI_PROBE_REQUIRED: "1"
        run: |
          set -euo pipefail
          python -m pytest -q -rs -p no:cacheprovider tests/test_cli_egress_probe.py | tee probe.log
          if grep -qE '[0-9]+ (skipped|deselected)' probe.log; then
            echo "::error title=Security tests skipped::the CLI egress probe skipped tests"
            exit 1
          fi

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          docker run --rm -v "$PWD/deploy:/mnt:ro" -v "$PWD/docker:/mnt-docker:ro" \
            koalaman/shellcheck:v0.10.0 -x \
            /mnt/remote-deploy.sh /mnt/smoke-test.sh /mnt/verify-restore.sh /mnt/make-bundle.sh \
            /mnt/build-artifacts.sh /mnt/sign-bundle.sh /mnt/check-host-isolation.sh \
            /mnt/host-egress-guard.sh /mnt/check-dns.sh /mnt-docker/egress-proxy.sh /mnt-docker/egress-healthcheck.sh \
            /mnt-docker/egress-forbidden-check.sh /mnt-docker/isolation-gate.sh

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install . pip-audit
      - run: pip-audit --skip-editable

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0}
      - run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --redact --verbose

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # compose gives every service with a route out an explicit resolver (docs/deployment.md, "DNS");
      # the production default 10.0.2.3 is slirp4netns' and does not exist on this rootful runner
      HUNTER_DNS: 1.1.1.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate throwaway secrets
        run: |
          {
            for k in POSTGRES_PASSWORD ADMIN_TOKEN AGENT_TOKEN_CLAUDE_1 \
                     AGENT_TOKEN_CLAUDE_2 AGENT_TOKEN_CODEX; do
              echo "$k=$(openssl rand -hex 24)"
            done
            echo "AGENT_MODE=demo"
          } > .env
          echo "ADMIN_TOKEN=$(grep '^ADMIN_TOKEN=' .env | cut -d= -f2-)" >> "$GITHUB_ENV"
      - name: Validate compose file
        run: docker compose config -q
      - name: Lint Dockerfiles
        run: |
          for f in app agent egress-proxy; do
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint \
              --ignore DL3008 --ignore DL3013 --ignore DL3016 - < docker/$f.Dockerfile
          done
      - name: Build, start and wait for healthchecks (real daemon)
        run: docker compose up -d --build --wait --wait-timeout 420
      - name: Smoke + isolation + egress + forged-task test
        env:
          # GitHub-hosted runners are rootful with sshd on all interfaces, so the
          # proxy->host probe is reported, not enforced. It is enforced on the server.
          SMOKE_HOST_ISOLATION: report
        run: deploy/smoke-test.sh
      - name: Probe tools run in the real images (positive controls), defects are fatal
        shell: bash
        env:
          SMOKE_HOST_ISOLATION: report      # reachability on a rootful runner is only reported...
        run: |
          set -euo pipefail
          # ... but a broken/missing nc or python, a failed exec or an incomplete result is FATAL
          # in report mode too, and this line proves the controls ran in every container
          deploy/check-host-isolation.sh 2>&1 | tee probe.log
          grep -q 'probe controls verified in' probe.log
      - name: DNS check runs in the real images (positive controls), defects and leaks are fatal
        shell: bash
        env:
          SMOKE_HOST_ISOLATION: report      # public resolution is only reported on a rootful runner...
        run: |
          set -euo pipefail
          # ... but a missing resolver tool, a failed exec, a service name resolving across networks,
          # an internal-only service resolving anything outside, or a DNS path outside the explicit
          # resolver is FATAL in report mode too
          deploy/check-dns.sh 2>&1 | tee dns.log
          grep -Eq '^ok   DNS: |^WARN   - ' dns.log
      - name: Backup restores into a scratch database
        run: deploy/verify-restore.sh
      - name: Agents and proxies run unprivileged
        run: |
          for s in agent-claude-1 agent-claude-2 agent-codex egress-codex; do
            docker compose exec -T $s id -u | grep -vx 0
          done
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down -v
